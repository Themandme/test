name: SeniorDirectory

# Generate the Xcode project with:  xcodegen generate   (run from ios/)
# See README.md for the one-command bootstrap.

options:
  bundleIdPrefix: app.seniordirectory
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Set your team id (or pass via xcconfig / CI) to enable signing:
    # DEVELOPMENT_TEAM: ABCDE12345

targets:
  SeniorDirectory:
    type: application
    platform: iOS
    sources:
      - path: SeniorDirectory
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.seniordirectory.app
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        CODE_SIGN_STYLE: Automatic
    info:
      path: SeniorDirectory/Info.plist
      properties:
        CFBundleDisplayName: Safe Numbers
        # Read by AppConfig.apiBaseURL — override per-scheme/CI as needed.
        API_BASE_URL: https://api.senior-directory.app
        # Required so Dialer's canOpenURL(tel:) returns true.
        LSApplicationQueriesSchemes:
          - tel
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  SeniorDirectoryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeniorDirectoryTests
    dependencies:
      - target: SeniorDirectory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.seniordirectory.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  SeniorDirectory:
    build:
      targets:
        SeniorDirectory: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SeniorDirectoryTests
    profile:
      config: Release
    archive:
      config: Release
