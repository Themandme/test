name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-contract:
    name: Data contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Validate brands.json + schemas
        run: python data/validate.py

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (advisory)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || echo "::warning::pip-audit reported findings"

  ios:
    name: iOS app (build + test)
    # macOS runner required for SwiftUI/CryptoKit/UIKit + Xcode toolchain.
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      # Uses the runner's default Xcode (15.x on macos-14), which supports iOS 17.
      # NOTE: do NOT `brew install xcodegen` — Homebrew's latest (2.45.x) writes the
      # Xcode-16.3 project format (objectVersion 77), which the runner's Xcode 15.4
      # cannot open. Pin 2.42.0, which writes objectVersion 56 (Xcode 14/15/16-compatible).
      - name: Install XcodeGen (pinned 2.42.0)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          BIN="$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm +111 | head -1)"
          test -n "$BIN" || { echo "xcodegen binary not found in zip"; exit 1; }
          echo "XCODEGEN=$BIN" >> "$GITHUB_ENV"
      - name: Generate project
        run: |
          "$XCODEGEN" generate
      - name: Resolve Swift packages (GRDB)
        run: xcodebuild -resolvePackageDependencies -project SeniorDirectory.xcodeproj -scheme SeniorDirectory
      - name: Build & test
        run: |
          xcodebuild test \
            -project SeniorDirectory.xcodeproj \
            -scheme SeniorDirectory \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
