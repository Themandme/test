name: Owings Mills jobs

# Daily at 11:23 UTC. That is 7:23am while US Eastern observes daylight time
# and 6:23am during standard time. Official ATS feeds are current inventories,
# so one incremental morning pass is enough and avoids duplicate daily traffic.
# Off-the-hour on purpose: :00 and :30 are the busiest shared scheduler slots.
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:        # lets you run it on demand from the Actions tab
  push:
    paths:
      # Connector-safe manual trigger: updating this one file starts the same
      # complete catch-up scan without making ordinary repository pushes run it.
      - 'career-ops/.run-now'

permissions:
  contents: write           # needed to commit the refreshed digest

concurrency:
  group: owings-mills-jobs
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # donsetch HiringCafe pull can run for hours behind captcha walls

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Without this the three sweeps below die instantly on
      # ERR_MODULE_NOT_FOUND for js-yaml — which `continue-on-error` then
      # swallowed, so the run went green while refreshing nothing.
      #
      # `npm install`, not `npm ci`, and no setup-node `cache:` — both need a
      # lockfile, and career-ops gitignores package-lock.json (.gitignore:107),
      # so it does not exist on the runner. Pointing cache-dependency-path at
      # it failed setup-node outright.
      #
      # --ignore-scripts skips Playwright's browser download: none of the
      # scheduled scanners drive a browser, and it costs ~30s and ~400MB.
      - name: Install dependencies
        working-directory: career-ops
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install donsetch (HiringCafe transport)
        # Direct node fetch gets Cloudflare-walled; donsetch's Chrome-parity
        # TLS passes. The via-donsetch driver calls `donsetch` from PATH.
        run: npm install -g donsetch && donsetch --version

      - name: Restore HiringCafe page checkpoints
        # Checkpoints self-validate on buildId/total/pageSize inside the
        # driver, so stale cache entries simply miss. Without this a
        # timeout-kill loses all progress (runner workspaces are ephemeral).
        uses: actions/cache@v4
        with:
          path: career-ops/checkpoint-hc-pages
          key: hc-checkpoints-v2-${{ hashFiles('career-ops/scan-hiringcafe-via-donsetch.mjs') }}
          restore-keys: hc-checkpoints-v2-

      - name: Scan complete HiringCafe 10-mile radius
        id: hiringcafe_scheduled
        if: github.event_name == 'schedule'
        working-directory: career-ops
        continue-on-error: true
        run: |
          node --test tests/hiringcafe-full.test.mjs
          node scan-hiringcafe-via-donsetch.mjs

      - name: On-demand complete HiringCafe 10-mile radius
        id: hiringcafe_catchup
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        working-directory: career-ops
        continue-on-error: true
        run: |
          node --test tests/hiringcafe-full.test.mjs
          node scan-hiringcafe-via-donsetch.mjs

      - name: Scan nationwide U.S. remote jobs
        id: hiringcafe_remote
        working-directory: career-ops
        continue-on-error: true
        # The scanner itself waits until September 2 Eastern, then keeps only
        # nationwide remote postings under 24 hours old with salary floors
        # above $55,000. State-restricted remote jobs are rejected.
        run: |
          node --test tests/hiringcafe-remote.test.mjs
          node scan-hiringcafe-remote.mjs

      - name: Sweep the local Workday tenants
        id: workday
        working-directory: career-ops
        # Location-first and title-blind, same as the scan above. Tenants and
        # the location rules come from portals.yml `local_workday`, which is
        # gitignored — so on the runner this falls back to the built-in list.
        # Keep the two in step when the roster changes.
        # continue-on-error: individual tenants fail routinely (422 on a moved
        # site path, 500 from the tenant) and a partial sweep is still worth
        # committing; it must not take the whole scheduled run down.
        continue-on-error: true
        run: node scan-local-workday.mjs

      - name: Sweep other official ATS boards
        id: direct_ats
        working-directory: career-ops
        # Greenhouse, SmartRecruiters, iCIMS, BambooHR, Rippling and Jobvite
        # boards seeded from employers previously seen near Owings Mills.
        # Each provider is queried directly; HiringCafe is not in this path.
        continue-on-error: true
        run: |
          node --test tests/direct-ats.test.mjs
          node scan-direct-ats.mjs

      - name: Sweep Maryland state government (JobAps)
        id: mdgov
        working-directory: career-ops
        # The only source that publishes a real filing deadline, so closed
        # postings are dropped rather than inferred.
        continue-on-error: true
        run: node scan-maryland-gov.mjs

      - name: Sweep county and city government (NEOGOV)
        id: neogov
        working-directory: career-ops
        # Baltimore County, CCBC, Howard, Anne Arundel, Montgomery, M-NCPPC,
        # Frederick and DC. Agency slugs come from portals.yml `neogov`, which
        # is gitignored — so on the runner this falls back to the built-in list.
        # Keep the two in step when the roster changes.
        continue-on-error: true
        run: node scan-neogov.mjs

      - name: Rebuild unified scored list
        id: unified
        working-directory: career-ops
        # Always render after every source has had its turn. This keeps the
        # unified files current even when NEOGOV itself fails but another source
        # succeeds. --unified-only performs no network requests or store writes.
        run: node scan-neogov.mjs --unified-only

      - name: Commit the digest and sweep state
        id: commit
        working-directory: career-ops
        # The store carries the rotating window's cursor and the accumulated
        # listings, so it MUST be committed — without it every run restarts at
        # chunk 0 and the rotation never advances. It changes on every run (the
        # cursor always moves), so it is checked separately from the digest,
        # which only changes when listings do.
        run: |
          changes="$(git status --porcelain -- owings-mills-latest.md owings-mills-store.json remote-jobs-latest.md remote-jobs-store.json local-workday-store.json direct-ats-store.json maryland-gov-store.json neogov-store.json unified-local-jobs.md unified-local-jobs.json)"
          if [ -z "$changes" ]; then
            echo "No change in local job listings or sweep state — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owings-mills-latest.md owings-mills-store.json remote-jobs-latest.md remote-jobs-store.json local-workday-store.json direct-ats-store.json maryland-gov-store.json neogov-store.json unified-local-jobs.md unified-local-jobs.json
          git commit -m "Owings Mills jobs: refresh listings ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          # Concurrent-safe: another run (or a push from a session) may have
          # landed first, and this job's only local commit is the one above.
          branch="${GITHUB_REF_NAME}"
          git pull --rebase --autostash origin "$branch"
          git push origin "HEAD:$branch"

      - name: Summary
        if: steps.unified.outcome == 'success' && steps.commit.outcome == 'success'
        working-directory: career-ops
        run: |
          {
            echo "### Owings Mills job scan"
            echo
            head -6 owings-mills-latest.md | tail -4
            echo
            echo "See \`career-ops/unified-local-jobs.md\` for the deduplicated scored list."
          } >> "$GITHUB_STEP_SUMMARY"

      # `continue-on-error` lets healthy sources finish and commit even when one
      # source fails. The final check reports the selected HiringCafe mode plus
      # every downstream stage, and treats skipped/cancelled steps as incomplete
      # rather than silently calling the workflow successful.
      - name: Report workflow outcomes
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          HIRINGCAFE_SCHEDULED: ${{ steps.hiringcafe_scheduled.outcome }}
          HIRINGCAFE_CATCHUP: ${{ steps.hiringcafe_catchup.outcome }}
          HIRINGCAFE_REMOTE: ${{ steps.hiringcafe_remote.outcome }}
          WORKDAY: ${{ steps.workday.outcome }}
          DIRECT_ATS: ${{ steps.direct_ats.outcome }}
          MDGOV: ${{ steps.mdgov.outcome }}
          NEOGOV: ${{ steps.neogov.outcome }}
          UNIFIED: ${{ steps.unified.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            hiringcafe_label="HiringCafe complete radius scan"
            hiringcafe_outcome="$HIRINGCAFE_SCHEDULED"
          else
            hiringcafe_label="HiringCafe full catch-up"
            hiringcafe_outcome="$HIRINGCAFE_CATCHUP"
          fi
          {
            echo
            echo "| Stage | Outcome |"
            echo "|---|---|"
            echo "| $hiringcafe_label | $hiringcafe_outcome |"
            echo "| HiringCafe nationwide remote | $HIRINGCAFE_REMOTE |"
            echo "| Local Workday tenants | $WORKDAY |"
            echo "| Other official ATS boards | $DIRECT_ATS |"
            echo "| Maryland state (JobAps) | $MDGOV |"
            echo "| County/city gov (NEOGOV) | $NEOGOV |"
            echo "| Unified scored list | $UNIFIED |"
            echo "| Commit refreshed data | $COMMIT |"
          } >> "$GITHUB_STEP_SUMMARY"
          incomplete=""
          for pair in             "HiringCafe:$hiringcafe_outcome"             "HiringCafeRemote:$HIRINGCAFE_REMOTE"             "Workday:$WORKDAY"             "DirectATS:$DIRECT_ATS"             "JobAps:$MDGOV"             "NEOGOV:$NEOGOV"             "Unified:$UNIFIED"             "Commit:$COMMIT"
          do
            outcome="${pair#*:}"
            [ "$outcome" = "success" ] || incomplete="$incomplete ${pair%%:*}($outcome)"
          done
          if [ -n "$incomplete" ]; then
            echo "::error::incomplete workflow stages:$incomplete"
            exit 1
          fi
          echo "All workflow stages completed successfully."
