name: Owings Mills jobs

# Twice daily, 7:23am and 5:23pm US Eastern (EDT = UTC-4).
# Off-the-hour on purpose: :00 and :30 are the busiest slots on GitHub's
# shared schedulers and get queued the longest.
on:
  schedule:
    - cron: '23 11 * * *'
    - cron: '23 21 * * *'
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write           # needed to commit the refreshed digest

concurrency:
  group: owings-mills-jobs
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30     # each run reads a rotating 60 of ~465 sitemap chunks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: career-ops/package-lock.json

      # Without this the three sweeps below die instantly on
      # ERR_MODULE_NOT_FOUND for js-yaml — which `continue-on-error` then
      # swallowed, so the run went green while refreshing nothing.
      # --ignore-scripts skips Playwright's browser download: none of the
      # scheduled scanners drive a browser, and it costs ~30s and ~400MB.
      - name: Install dependencies
        working-directory: career-ops
        run: npm ci --ignore-scripts

      # Without this the three sweeps below die instantly on
      # ERR_MODULE_NOT_FOUND for js-yaml — which `continue-on-error` then
      # swallowed, so the run went green while refreshing nothing.
      #
      # `npm install`, not `npm ci`, and no setup-node `cache:` — both need a
      # lockfile, and career-ops gitignores package-lock.json (.gitignore:107),
      # so it does not exist on the runner. Pointing cache-dependency-path at
      # it failed setup-node outright.
      #
      # --ignore-scripts skips Playwright's browser download: none of the
      # scheduled scanners drive a browser, and it costs ~30s and ~400MB.
      - name: Install dependencies
        working-directory: career-ops
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Scan for local jobs
        working-directory: career-ops
        # No NODE_USE_ENV_PROXY here: that is only needed inside the Claude Code
        # sandbox, whose proxy Node's fetch ignores. GitHub runners reach the
        # network directly.
        run: node scan-owings-mills.mjs

      - name: Sweep the local Workday tenants
        id: workday
        working-directory: career-ops
        # Location-first and title-blind, same as the scan above. Tenants and
        # the location rules come from portals.yml `local_workday`, which is
        # gitignored — so on the runner this falls back to the built-in list.
        # Keep the two in step when the roster changes.
        # continue-on-error: individual tenants fail routinely (422 on a moved
        # site path, 500 from the tenant) and a partial sweep is still worth
        # committing; it must not take the whole scheduled run down.
        continue-on-error: true
        run: node scan-local-workday.mjs

      - name: Sweep Maryland state government (JobAps)
        id: mdgov
        working-directory: career-ops
        # The only source that publishes a real filing deadline, so closed
        # postings are dropped rather than inferred.
        continue-on-error: true
        run: node scan-maryland-gov.mjs

      - name: Sweep county and city government (NEOGOV)
        id: neogov
        working-directory: career-ops
        # Baltimore County, CCBC, Howard, Anne Arundel, Montgomery, M-NCPPC,
        # Frederick and DC. Agency slugs come from portals.yml `neogov`, which
        # is gitignored — so on the runner this falls back to the built-in list.
        # Keep the two in step when the roster changes.
        continue-on-error: true
        run: node scan-neogov.mjs

      - name: Commit the digest and sweep state
        working-directory: career-ops
        # The store carries the rotating window's cursor and the accumulated
        # listings, so it MUST be committed — without it every run restarts at
        # chunk 0 and the rotation never advances. It changes on every run (the
        # cursor always moves), so it is checked separately from the digest,
        # which only changes when listings do.
        run: |
          if git diff --quiet -- owings-mills-latest.md owings-mills-store.json local-workday-store.json maryland-gov-store.json neogov-store.json; then
            echo "No change in local job listings or sweep state — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owings-mills-latest.md owings-mills-store.json local-workday-store.json maryland-gov-store.json neogov-store.json
          git commit -m "Owings Mills jobs: refresh listings ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          # Concurrent-safe: another run (or a push from a session) may have
          # landed first, and this job's only local commit is the one above.
          git pull --rebase --autostash origin main
          git push

      - name: Summary
        working-directory: career-ops
        run: |
          {
            echo "### Owings Mills job scan"
            echo
            head -6 owings-mills-latest.md | tail -4
            echo
            echo "See \`career-ops/owings-mills-latest.md\` for the full list."
          } >> "$GITHUB_STEP_SUMMARY"

      # `continue-on-error` above keeps one broken source from stopping the
      # others or blocking the commit — but on its own it also turned a run in
      # which every sweep died into a green tick. This reports each outcome and
      # then fails the run, so the commit still lands and the breakage is still
      # visible.
      - name: Report sweep outcomes
        if: always()
        env:
          WORKDAY: ${{ steps.workday.outcome }}
          MDGOV: ${{ steps.mdgov.outcome }}
          NEOGOV: ${{ steps.neogov.outcome }}
        run: |
          {
            echo
            echo "| Sweep | Outcome |"
            echo "|---|---|"
            echo "| Local Workday tenants | $WORKDAY |"
            echo "| Maryland state (JobAps) | $MDGOV |"
            echo "| County/city gov (NEOGOV) | $NEOGOV |"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=""
          for pair in "Workday:$WORKDAY" "JobAps:$MDGOV" "NEOGOV:$NEOGOV"; do
            [ "${pair#*:}" = "failure" ] && failed="$failed ${pair%%:*}"
          done
          if [ -n "$failed" ]; then
            echo "::error::sweeps failed:$failed — their stores were not refreshed this run"
            exit 1
          fi
          echo "All sweeps completed."
